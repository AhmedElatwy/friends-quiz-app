name: Build Flet APK

on:
  workflow_dispatch: # يسمح بتشغيل البناء يدوياً بضغطة زر
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flet and Build APK
        run: |
          pip install --upgrade flet
          flet build apk --project "FriendsQuiz"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FriendsQuiz-APK
          path: build/apk/*.apk
